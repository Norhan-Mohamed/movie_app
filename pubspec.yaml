name: movie_app
description: A Flutter movie browsing app with local auth, favorites, and IMDb Top 100 via RapidAPI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  path: ^1.9.0
  sqflite: ^2.4.1
  shared_preferences: ^2.3.3
  fluttertoast: ^8.2.8
  font_awesome_flutter: ^10.8.0
  carousel_slider: ^5.0.0
  youtube_player_flutter: ^9.1.1
  path_provider: ^2.1.5
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/movie.png
    - assets/movie2.png

  fonts:
    - family: FontsFree-Net-SFProText-Regular.ttf
      fonts:
        - asset: fonts/FontsFree-Net-SFProText-Regular.ttf
